
    
  
name: Update profile assets

# Generate public-only profile statistics. No personal access token is required.

on:
  schedule:
    - cron: "30 */6 * * *" # Every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_assets.py"
      - ".github/workflows/profile-assets.yml"

# Serialize updates so scheduled/manual runs cannot race while committing assets.
concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate public-only SVGs
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile_assets.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophies.svg assets/activity-graph.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update public profile assets"
            git push origin HEAD:main
          fi

